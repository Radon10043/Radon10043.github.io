lang:                  en
title:                 Jiaming Zhang
copyright:             © 2024. All rights reserved.

logo:                  /assets/img/avatar.png

author:
  social:
    github: Radon10043
    email:  radon@xs.ustb.edu.cn
    csdn:   https://blog.csdn.net/qq_39209008

permalink:             /blog/:year/:month/:day/:title/

# So `jekyll serve` is reachable from outside a container without needing
# `--host 0.0.0.0` on the command line every time.
host:                  0.0.0.0

# Keep repo/dev-tooling files out of the published site.
exclude:
  - README.md
  - LICENSE.md
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-theme-hydejack.gemspec
  - docker/
  - licenses/
  - .scripts/
  - _js/
  - node_modules/
  - vendor/

plugins:
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-avatar

accent_image:          /assets/img/ff1.jpg
accent_color:          rgb(79,177,186)
theme_color:           rgb(25,55,71)

google_fonts:          "Roboto Slab:700|Noto Sans:400,400i,700,700i"
font:                  "Noto Sans, PingFang SC, Microsoft YaHei, SimHei, Helvetica, Arial, sans-serif"
font_heading:          "Roboto Slab, PingFang SC, Microsoft YaHei, SimHei, Helvetica, Arial, sans-serif"

hydejack:
  post_addons:         [about, newsletter, related, random, comments]
  project_addons:      [about, newsletter, other, comments]

  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false

  use_lsi:             true
  cookies_banner:      true
  advertise:           true
  hide_dates:          false
  hide_last_modified:  false

  dark_mode:
    always:            false
    dynamic:           true
    sunrise:           6
    sunset:            18
    icon:              true

  offline:
    enabled:           false
    cache_version:     1
    precache_assets:
      - /assets/img/swipe.svg

optional_front_matter:
  remove_originals:    true

relative_links:
  collections:         true

titles_from_headings:
  strip_title:         true
  collections:         false

compress_html:
  comments:            ["<!-- ", " -->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed
